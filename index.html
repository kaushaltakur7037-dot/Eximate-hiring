<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eximate - Job Application</title>
<style>
:root{--ink:#10302f;--muted:#5b7270;--bg:#eef5f3;--card:#fff;--line:#cfdedb;--brand:#0c6b62;--brand-d:#08524b;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:28px;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 24px;font-family:system-ui,sans-serif;font-size:15px}
form{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;font-family:system-ui,sans-serif}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
label:first-of-type{margin-top:0}
input,select,textarea{width:100%;padding:11px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row{grid-template-columns:1fr}}
button{width:100%;margin-top:22px;padding:13px;font:inherit;font-size:16px;font-weight:600;color:#fff;background:var(--brand);border:0;border-radius:6px;cursor:pointer}
button:hover{background:var(--brand-d)}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;font-size:14px;min-height:20px}
.msg.err{color:var(--err)}
.done{display:none;text-align:center;padding:32px 8px;font-family:system-ui,sans-serif}
.done h2{font-family:Georgia,serif;margin:0 0 8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Apply for a job at Eximate</h1>
  <p class="sub">Fill in your details. Our team will contact you soon.</p>

  <form id="f" novalidate>
    <label for="name">Full name</label>
    <input id="name" required autocomplete="name">

    <div class="row">
      <div>
        <label for="phone">Mobile number</label>
        <input id="phone" type="tel" inputmode="numeric" maxlength="10" required autocomplete="tel">
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>
    </div>

    <div class="row">
      <div>
        <label for="city">City</label>
        <input id="city" required autocomplete="address-level2">
      </div>
      <div>
        <label for="position">Position applying for</label>
        <select id="position" required>
          <option value="">Select</option>
          <option>Medical Representative</option>
          <option>Sales Executive</option>
          <option>Marketing</option>
          <option>Accounts</option>
          <option>Office / Admin</option>
          <option>Warehouse / Delivery</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="qualification">Qualification</label>
        <input id="qualification" required>
      </div>
      <div>
        <label for="experience">Experience (years)</label>
        <input id="experience" type="number" min="0" max="50" step="0.5" required>
      </div>
    </div>

    <label for="resume">Resume link (Google Drive, optional)</label>
    <input id="resume" type="url" placeholder="https://">

    <label for="about">About you (optional)</label>
    <textarea id="about"></textarea>

    <button id="btn" type="submit">Submit application</button>
    <div id="msg" class="msg" role="alert"></div>
  </form>

  <div id="done" class="done">
    <h2>Thank you!</h2>
    <p>We have received your application and will contact you soon.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwqU9s9s7JZLqyLa7Neb4XVmE_O2Iwmn4",
  authDomain: "eximate-hiring.firebaseapp.com",
  projectId: "eximate-hiring",
  storageBucket: "eximate-hiring.firebasestorage.app",
  messagingSenderId: "1051709679162",
  appId: "1:1051709679162:web:27d9e97ebff3a710073703"
};

const db = getFirestore(initializeApp(firebaseConfig));
const $ = id => document.getElementById(id);
const msg = (t, err) => { $("msg").textContent = t; $("msg").className = "msg" + (err ? " err" : ""); };

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const data = {
    name: $("name").value.trim(),
    phone: $("phone").value.trim(),
    email: $("email").value.trim(),
    city: $("city").value.trim(),
    position: $("position").value,
    qualification: $("qualification").value.trim(),
    experience: $("experience").value,
    resume: $("resume").value.trim(),
    about: $("about").value.trim()
  };
  if (!data.name || !data.city || !data.position || !data.qualification || data.experience === "")
    return msg("Please fill in all required fields.", true);
  if (!/^[6-9]\d{9}$/.test(data.phone))
    return msg("Enter a valid 10-digit mobile number.", true);
  if (!/^\S+@\S+\.\S+$/.test(data.email))
    return msg("Enter a valid email address.", true);

  $("btn").disabled = true;
  msg("Submitting...");
  try {
    await addDoc(collection(db, "applications"), { ...data, createdAt: serverTimestamp() });
    $("f").style.display = "none";
    $("done").style.display = "block";
  } catch (err) {
    console.error(err);
    msg("Could not submit. Check your internet and try again.", true);
    $("btn").disabled = false;
  }
});
</script>
</body>
</html>
